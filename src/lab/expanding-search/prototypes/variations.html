<!doctype html>
<!-- PROTOTYPE — throwaway. Four variations of the expanding search, side by side.
     Open this file directly in a browser. Nothing here ships; the shipped demo is
     ../ExpandingSearch.tsx. Dimensions varied: expansion technique, loading style,
     hover highlight, result entrance. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Expanding search — 4 variations</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0a0a0a; color: #f4f4f4; font: 14px/1.4 system-ui, -apple-system, sans-serif; padding: 24px; }
  h1 { font-size: 16px; font-weight: 500; margin: 0 0 4px; }
  .hint { color: #8e8e93; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 24px; }
  .panel h2 { font-size: 13px; font-weight: 500; margin: 0 0 8px; color: #d1d1d6; }
  .panel h2 span { color: #8e8e93; font-weight: 400; }
  .stage { position: relative; aspect-ratio: 4 / 3; background: #111; border: 0.5px solid #333; border-radius: 12px; overflow: hidden; display: grid; place-items: center; }
  .notes { margin: 10px 0 0; padding: 0 0 0 16px; color: #a1a1a6; font-size: 12.5px; }
  .notes li { margin: 2px 0; }
  .notes b { color: #d1d1d6; font-weight: 500; }
  .reset { position: absolute; top: 8px; right: 8px; background: none; border: 1px solid #333; color: #8e8e93; border-radius: 6px; font: inherit; font-size: 11px; padding: 2px 8px; cursor: pointer; }

  /* ---- shared card anatomy ---- */
  .card { --dur: 420ms; --ease: cubic-bezier(0.32, 0.72, 0, 1); width: 320px; background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 22px; display: grid; grid-template-rows: 0fr auto; }
  .card[data-state="idle"] { border-radius: 999px; }
  .body { min-height: 0; overflow: hidden; }
  .body-inner { padding: 8px 8px 4px; }
  .bar { display: flex; align-items: center; gap: 6px; padding: 6px; }
  .input { flex: 1; height: 32px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; color: #f4f4f4; font: inherit; outline: none; }
  .input::placeholder { color: #8e8e93; }
  .go { width: 32px; height: 32px; border-radius: 999px; border: 0; background: #f4f4f4; color: #111; cursor: pointer; display: grid; place-items: center; opacity: 0; transform: translateX(8px); transition: opacity 200ms ease, transform 260ms var(--ease); }
  .card:not([data-state="idle"]) .go { opacity: 1; transform: none; transition-delay: calc(var(--dur) * 0.4); }
  .list { list-style: none; margin: 0; padding: 0; position: relative; }
  .row { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 12px; cursor: default; }
  .row .t { color: #f4f4f4; } .row .s { color: #8e8e93; font-size: 12.5px; }
  .sk { height: 42px; padding: 8px 12px; box-sizing: border-box; }
  .sk i { display: block; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #2c2c2e 0%, #3a3a3c 50%, #2c2c2e 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  .sk i + i { margin-top: 8px; width: 60%; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .spinner { display: grid; place-items: center; height: 168px; }
  .spinner i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #3a3a3c; border-top-color: #f4f4f4; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .layer { transition: opacity 150ms ease; }
  .layer[hidden] { display: none; }

  /* ---- A: grid-row height reveal, bottom-anchored ---- */
  .vA .card { transition: grid-template-rows var(--dur) var(--ease), border-radius var(--dur) var(--ease); }
  .vA .card:not([data-state="idle"]) { grid-template-rows: 1fr auto; }
  /* ---- B: clip-path reveal ---- */
  .vB .card { grid-template-rows: auto auto; clip-path: inset(calc(100% - 44px) 0 0 0 round 999px); transition: clip-path var(--dur) var(--ease); }
  .vB .card:not([data-state="idle"]) { clip-path: inset(0 0 0 0 round 22px); }
  .vB .body { visibility: hidden; } .vB .card:not([data-state="idle"]) .body { visibility: visible; }
  /* ---- C: scaleY morph from the input ---- */
  .vC .card { grid-template-rows: auto auto; transform-origin: 50% 100%; }
  .vC .body-inner { transform-origin: 50% 100%; transform: scaleY(0); opacity: 0; transition: transform var(--dur) var(--ease), opacity 200ms ease; }
  .vC .body { max-height: 0; transition: max-height var(--dur) var(--ease); }
  .vC .card:not([data-state="idle"]) .body { max-height: 220px; }
  .vC .card:not([data-state="idle"]) .body-inner { transform: none; opacity: 1; }
  /* ---- D: height reveal with overshoot ---- */
  .vD .card { --ease: cubic-bezier(0.34, 1.3, 0.64, 1); transition: grid-template-rows var(--dur) var(--ease), border-radius var(--dur) ease; }
  .vD .card:not([data-state="idle"]) { grid-template-rows: 1fr auto; }

  /* hover: shared highlight */
  .hl { position: absolute; left: 0; width: 100%; border-radius: 12px; background: #2c2c2e; opacity: 0; pointer-events: none; transition: transform 220ms cubic-bezier(0.25, 1, 0.5, 1), height 220ms cubic-bezier(0.25, 1, 0.5, 1), opacity 150ms ease; top: 0; }
  .hl.bouncy { transition-timing-function: cubic-bezier(0.34, 1.4, 0.64, 1); }
  .hl.on { opacity: 1; }
  .row > * { position: relative; }
  /* hover: per-row */
  .perrow .row::before { content: ''; position: absolute; inset: 0; border-radius: 12px; background: #2c2c2e; opacity: 0; transform: scale(0.96); transition: opacity 150ms ease, transform 200ms cubic-bezier(0.25, 1, 0.5, 1); }
  .perrow .row:hover::before { opacity: 1; transform: none; }
  .perrow.fadeonly .row::before { transform: none; }

  /* entrance */
  .stagger .row { opacity: 0; transform: translateY(6px); animation: rise 260ms cubic-bezier(0.19, 1, 0.22, 1) forwards; animation-delay: calc(var(--i) * 35ms); }
  .atonce .row { opacity: 0; animation: fade 180ms ease forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
</style>
</head>
<body>
<h1>Expanding search — four variations</h1>
<p class="hint">Type anything and press Enter in each stage. Hover the results. Reset with the button in the corner.</p>
<div class="grid" id="grid"></div>

<template id="tpl">
  <div class="card" data-state="idle">
    <div class="body"><div class="body-inner">
      <div class="layer loading" hidden></div>
      <ul class="layer list results" hidden></ul>
    </div></div>
    <div class="bar">
      <input class="input" placeholder="Search…" aria-label="Search" />
      <button class="go" aria-label="Search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    </div>
  </div>
</template>

<script>
const RESULTS = [
  ['Sliding tabs', 'Lab · motion, navigation'],
  ['Designing with constraints', 'Writing · 6 min read'],
  ['Herdr', 'Project · 2025'],
  ['About Roni', 'Page'],
];
const VARIANTS = [
  { key: 'A', name: 'Height reveal · skeleton · shared highlight · staggered', cls: 'vA', loading: 'skeleton', hover: 'shared', entrance: 'stagger',
    notes: ['<b>Expansion:</b> <code>grid-template-rows 0fr→1fr</code>, bottom-anchored. Interruptible, no measuring, radius morphs pill→card.',
            '<b>Skeleton</b> pre-draws the result shape so results feel like a fill-in, not a swap.',
            '<b>Shared highlight</b> gives the list a single moving object to track; matches the sliding-tabs vocabulary.',
            '<b>Stagger 35ms</b> reads as arrival without slowing the total past ~400ms.',
            'Trade-off: most moving parts; needs a spring lib (or CSS top/height transitions) for the pill.'] },
  { key: 'B', name: 'Clip-path reveal · spinner · per-row fade · at once', cls: 'vB', loading: 'spinner', hover: 'perrow fadeonly', entrance: 'atonce',
    notes: ['<b>Clip-path</b> reveals a fully laid-out card: content never reflows, cheapest to composite.',
            'But the card occupies its final box from the start, so it cannot shift siblings and the input must already sit at the bottom of the box.',
            '<b>Spinner</b> is honest and small, but the 168px empty area feels vacant and the swap to results is abrupt.',
            '<b>Per-row fade</b> is trivial CSS with no JS; loses the sense of one object moving.',
            '<b>At once</b> is the fastest to results; lowest ceremony, least "designed".'] },
  { key: 'C', name: 'ScaleY morph · skeleton · per-row scale-in · staggered', cls: 'vC', loading: 'skeleton', hover: 'perrow', entrance: 'stagger',
    notes: ['<b>ScaleY from the input</b> gives a "growing out of" feel, but text squashes during the motion, which reads cheap at 4 rows.',
            'Needs a paired max-height transition anyway, so it is not simpler than A.',
            '<b>Per-row scale-in</b> (0.96→1) is a small, tasteful hover with zero JS.',
            'Skeleton + stagger as in A.',
            'Trade-off: the squash is the one thing people notice, and not in a good way.'] },
  { key: 'D', name: 'Height reveal with overshoot · spinner→results · bouncy shared highlight · at once', cls: 'vD', loading: 'spinner', hover: 'shared bouncy', entrance: 'atonce',
    notes: ['Same mechanics as A but with <b>bounce</b> on both the expansion and the highlight.',
            'Reads playful on first view; the overshoot on the card edge makes the input appear to dip, which fights the "input stays put" goal.',
            '<b>Spinner→results</b> crossfade at once is clean but the results pop in as a block.',
            'Pick this if the site wanted personality; the rest of the site is quiet, so probably not.'] },
];

function build(v) {
  const panel = document.createElement('section');
  panel.className = 'panel ' + v.cls;
  panel.innerHTML = `<h2>${v.key} <span>— ${v.name}</span></h2><div class="stage"><button class="reset">reset</button></div><ul class="notes">${v.notes.map(n => `<li>${n}</li>`).join('')}</ul>`;
  const stage = panel.querySelector('.stage');
  const card = document.getElementById('tpl').content.firstElementChild.cloneNode(true);
  stage.appendChild(card);
  const input = card.querySelector('.input'), go = card.querySelector('.go');
  const loading = card.querySelector('.loading'), results = card.querySelector('.results');
  let token = 0, hl;

  loading.innerHTML = v.loading === 'skeleton'
    ? Array.from({length: 4}, () => '<div class="sk"><i></i><i></i></div>').join('')
    : '<div class="spinner"><i></i></div>';

  function setState(s) { card.dataset.state = s; }
  async function search() {
    const q = input.value.trim(); if (!q) return;
    const id = ++token;
    const wasIdle = card.dataset.state === 'idle';
    setState('expanding');
    results.hidden = true; results.innerHTML = '';
    if (wasIdle) await wait(v.cls === 'vB' || v.cls === 'vC' ? 200 : 260);
    if (id !== token) return;
    setState('loading'); loading.hidden = false; loading.style.opacity = 1;
    await wait(900); if (id !== token) return;
    loading.style.opacity = 0; await wait(120); loading.hidden = true;
    results.classList.remove('stagger', 'atonce'); results.classList.add(v.entrance);
    results.innerHTML = RESULTS.map(([t, s], i) => `<li class="row" style="--i:${i}" tabindex="0"><span class="t">${t} <span style="color:#8e8e93">· ${q}</span></span><span class="s">${s}</span></li>`).join('');
    if (v.hover.includes('shared')) {
      hl = document.createElement('div'); hl.className = 'hl' + (v.hover.includes('bouncy') ? ' bouncy' : '');
      results.prepend(hl);
      results.addEventListener('pointerover', e => { const r = e.target.closest('.row'); if (!r) return; hl.style.transform = `translateY(${r.offsetTop}px)`; hl.style.height = r.offsetHeight + 'px'; hl.classList.add('on'); });
      results.addEventListener('pointerleave', () => hl.classList.remove('on'));
    } else results.classList.add(...v.hover.split(' '));
    results.hidden = false; setState('results');
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') search(); if (e.key === 'Escape') reset(); });
  go.addEventListener('click', search);
  function reset() { token++; setState('idle'); loading.hidden = true; results.hidden = true; results.innerHTML = ''; input.value = ''; input.focus(); }
  panel.querySelector('.reset').addEventListener('click', reset);
  return panel;
}
VARIANTS.forEach(v => document.getElementById('grid').appendChild(build(v)));
</script>
</body>
</html>
